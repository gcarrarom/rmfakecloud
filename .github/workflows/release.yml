name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version from the first CHANGELOG heading, for example 0.0.46"
        required: true
        type: string

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.validate.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release version
        id: validate
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          version="v${REQUESTED_VERSION#v}"
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be semantic version x.y.z, with an optional leading v"
            exit 1
          fi

          changelog_version=$(awk '/^# [0-9]+\.[0-9]+\.[0-9]+$/ { print $2; exit }' CHANGELOG.md)
          if [[ "$changelog_version" != "${version#v}" ]]; then
            echo "CHANGELOG.md starts at ${changelog_version:-<missing>}, requested ${version#v}"
            exit 1
          fi

          if git ls-remote --exit-code origin "refs/tags/$version" >/dev/null 2>&1; then
            echo "Tag $version already exists; refusing to create another release"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create tag
        env:
          VERSION: ${{ steps.validate.outputs.version }}
        run: |
          git tag -a "$VERSION" "$GITHUB_SHA" -m "Release $VERSION"
          git push origin "$VERSION"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.validate.outputs.version }}
          name: ${{ steps.validate.outputs.version }}
          generate_release_notes: true

  build:
    name: Build Binaries
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.version }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ^1.23

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '21'
          cache: 'pnpm'
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install Cairo dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev pkg-config

      - name: Build
        run: make all

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Package Helm chart
        run: |
          version="${{ needs.release.outputs.version }}"
          image_version="${version#v}"
          helm package helm --version "$image_version" --app-version "$image_version" --destination dist

      - name: Upload binaries to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.version }}
          files: dist/*

  container:
    name: Build and Push Container Image
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.version }}
          fetch-depth: 0

      - name: Set Version
        run: |
          version="${{ needs.release.outputs.version }}"
          echo "version=$version" >> $GITHUB_ENV
          echo "image_version=${version:1}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ env.image_version }}
          build-args: |
            VERSION=${{ env.version }}

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
